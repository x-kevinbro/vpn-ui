# Build and publish the arm64 vpn-ui binary as a release asset, so the installer
# has a vpn-ui-arm64 to download (upstream ships amd64 only). Runs on GitHub's
# native arm64 runner, so the cgo/sqlite build and the Docker daemon bundle are
# built for aarch64 without emulation.
name: release-arm64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the arm64 asset to (e.g. v1.9.4-arm64). Created if absent."
        required: true
  push:
    tags:
      - "*-arm64"

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the fork with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file git wget
          # Docker is preinstalled on GitHub runners; confirm it is usable for the
          # daemon-bundle step, which builds inside alpine/rust containers.
          docker version

      - name: Build vpn-ui for arm64
        run: |
          chmod +x build.sh
          # Builds the Xray core (static), the Docker daemon bundles (static
          # musl) and the embedded assets. The panel binary it emits links the
          # runner's glibc (2.39), too new for older targets; it is recompiled
          # below against an older glibc and overwritten.
          ./build.sh --arch arm64
          test -f build/out/vpn-ui-arm64

      - name: Recompile the panel against an older glibc (Debian bullseye, glibc 2.31)
        run: |
          # The embeds (corebundle/, backend/bin/) are already generated by the
          # step above, so this only recompiles main.go. Debian bullseye's glibc
          # 2.31 matches Ubuntu 20.04 / Debian 11 targets, so the binary runs on
          # older hosts instead of demanding GLIBC_2.3x present only on the runner.
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            -e CGO_ENABLED=1 -e GOARCH=arm64 -e GOFLAGS=-buildvcs=false \
            -e GOTOOLCHAIN=auto \
            golang:1.23-bullseye \
            go build -trimpath -o build/out/vpn-ui-arm64 main.go
          test -f build/out/vpn-ui-arm64

      - name: Verify the binary needs no glibc newer than 2.31
        run: |
          file build/out/vpn-ui-arm64
          # Highest GLIBC_x.y symbol version the binary references.
          max=$(objdump -T build/out/vpn-ui-arm64 | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          if [ "$(printf '%s\n' GLIBC_2.31 "$max" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "binary requires $max, newer than glibc 2.31" >&2
            exit 1
          fi

      - name: Rename asset for the installer
        run: cp build/out/vpn-ui-arm64 vpn-ui-arm64

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the arm64 asset to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: vpn-ui-arm64
          fail_on_unmatched_files: true
